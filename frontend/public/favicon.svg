<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- event seeker, drawn for 16-32 px (browser tabs): the icon.svg spotlight with a solid
       beam and a bolder mic, since a gradient and thin lines blur at this size. -->
  <rect width="64" height="64" rx="14" fill="#10131c"/>
  <rect x="22" y="4" width="20" height="8" rx="3" fill="#f4b740"/>
  <path d="M25 13h14L54 50H10Z" fill="#f4b740"/>
  <ellipse cx="32" cy="50" rx="22" ry="7" fill="#f4b740"/>
  <!-- The mic: head with a grille band, a gap, then stem and base, so it never reads as a keyhole. -->
  <rect x="26.5" y="17" width="11" height="16" rx="5.5" fill="#10131c"/>
  <rect x="26.5" y="23.5" width="11" height="2.2" fill="#f4b740"/>
  <rect x="30.5" y="35.5" width="3" height="12" fill="#10131c"/>
  <rect x="23" y="47" width="18" height="4" rx="2" fill="#10131c"/>
</svg>
