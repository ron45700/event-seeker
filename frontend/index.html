<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10131c" />
    <meta name="color-scheme" content="dark" />
    <script>
      // Apply the stored theme before the first paint, so a light-theme visitor never sees
      // a dark flash. Same key and colours as src/lib/theme.ts.
      try {
        if (localStorage.getItem('es-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#eef0f4'
          document.querySelector('meta[name="color-scheme"]').content = 'light'
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>event seeker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
